<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicios S6 - JavaScript</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #f4f4f4; }
    button { display: block; width: 100%; padding: 12px; margin: 10px 0; font-size: 16px; cursor: pointer; }
    #resultado { margin-top: 20px; padding: 15px; background: white; border-radius: 8px; }
  </style>
</head>
<body>
  <h2>Ejercicios S6 - UNAB</h2>
  
  <button onclick="ejercicio1()">Ejercicio 1: Saludar nombres</button>
  <button onclick="ejercicio2()">Ejercicio 2: Menor número</button>
  <button onclick="ejercicio3()">Ejercicio 3: Suma de números</button>
  <button onclick="ejercicio4()">Ejercicio 4: Verificar valor</button>
  <button onclick="ejercicio5()">Ejercicio 5: Buscar índice</button>

  <div id="resultado"></div>

  <script>
    const res = document.getElementById("resultado");

    function ejercicio1() {
      let entrada = prompt("Ingrese nombres separados por espacio:");
      let nombres = entrada.split(" ");
      res.innerHTML = "<h3>Resultado Ej. 1:</h3>";
      nombres.forEach(nombre => {
        res.innerHTML += ¡Hola ${nombre}!<br>;
      });
    }

    function ejercicio2() {
      let entrada = prompt("Ingrese números separados por espacio:");
      let numeros = entrada.split(" ").map(Number);
      let menor = Math.min(...numeros);
      res.innerHTML = <h3>Resultado Ej. 2:</h3> El menor número es: ${menor};
    }

    function ejercicio3() {
      let entrada = prompt("Ingrese números separados por espacio:");
      let numeros = entrada.split(" ").map(Number);
      let suma = numeros.reduce((total, num) => total + num, 0);
      res.innerHTML = <h3>Resultado Ej. 3:</h3> La suma es: ${suma};
    }

    function ejercicio4() {
      let valores = prompt("Ingrese valores separados por espacio:");
      let arreglo = valores.split(" ");
      let buscar = prompt("Ingrese valor a buscar:");
      
      if (arreglo.includes(buscar)) {
        res.innerHTML = <h3>Resultado Ej. 4:</h3> El valor ${buscar} se encuentra entre los valores originales;
      } else {
        res.innerHTML = <h3>Resultado Ej. 4:</h3> El valor ${buscar} NO se encuentra;
      }
    }

    function ejercicio5() {
      let valores = prompt("Ingrese valores separados por espacio:");
      let arreglo = valores.split(" ");
      let buscar = prompt("Ingrese valor a buscar el índice:");
      let indice = arreglo.indexOf(buscar);

      if (indice !== -1) {
        res.innerHTML = <h3>Resultado Ej. 5:</h3> El valor ${buscar} se encuentra en el índice: ${indice};
      } else {
        res.innerHTML = <h3>Resultado Ej. 5:</h3> El valor ${buscar} no se ha encontrado;
      }
    }
  </script>
</body>
</html>
