<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Detalle - TechStore</title>
  <style>
    body { background: #0d0d0d; color: #fff; font-family: Arial; margin: 0; }
    header { background: #111; padding: 15px 30px; border-bottom: 2px solid #00ffff; }
    .logo { color: #00ffff; font-size: 24px; font-weight: bold; }
    .detalle { display: flex; gap: 30px; max-width: 1000px; margin: 30px auto; background: #1a1a1a; padding: 30px; border-radius: 10px; }
    .detalle img { width: 450px; border-radius: 8px; }
    .precio { font-size: 32px; color: #00ff88; font-weight: bold; }
    .btn { background: #00ffff; color: #000; padding: 14px; border: none; border-radius: 8px; font-weight: bold; width: 100%; margin-top: 15px; }
  </style>
</head>
<body>
  <header><div class="logo">TechStore</div></header>
  <a href="index.html" style="color:#00ffff;display:block;max-width:1000px;margin:20px auto">← Volver</a>
  
  <div class="detalle">
    <img src="https://i.imgur.com/8Km9tLL.jpg" alt="Lenovo Legion">
    <div>
      <h1>Portátil Lenovo Legion 5</h1>
      <p class="precio">$850,000</p>
      <p>Laptop Gamer de alto rendimiento.</p>
      <h3>Especificaciones:</h3>
      <ul>
        <li><b>Procesador:</b> AMD Ryzen 7 5800H</li>
        <li><b>RAM:</b> 16GB DDR4</li>
        <li><b>SSD:</b> 512GB NVMe</li>
        <li><b>Pantalla:</b> 15.6" 144Hz</li>
        <li><b>Gráfica:</b> RTX 3060 6GB</li>
      </ul>
      <button class="btn">Agregar al Carrito</button>
    </div>
  </div>
</body>
</html>
