<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicios</title>
</head>
<body>
    <script>
        document.write("<p><b>Ejercicio 1:</b> ¡Hola Mundo!</p>");
        let mensaje = "¡Hola Mundo!";
        document.write("<p><b>Ejercicio 2:</b> " + mensaje + "</p>");
        let nombre = prompt("Ejercicio 3 - Escribe tu nombre:");
        document.write("<p><b>Ejercicio 3:</b> ¡Hola " + nombre + "!</p>");
        let horas = parseFloat(prompt("Ejercicio 4 - Horas trabajadas:"));
        let costo = parseFloat(prompt("Ejercicio 4 - Costo por hora:"));
        document.write("<p><b>Ejercicio 4:</b> Tu paga es $" + (horas * costo) + "</p>");
        let peso = parseFloat(prompt("Ejercicio 5 - Peso en kg:"));
        document.write("<p><b>Ejercicio 5:</b> " + peso + " kg = " + (peso * 2.20462) + " lb</p>");
        let edad = parseInt(prompt("Ejercicio 6 - Tu edad:"));
        document.write("<p><b>Ejercicio 6:</b> En 10 años tendrás " + (edad + 10) + "</p>");
    </script>
</body>
</html>
